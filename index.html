<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz dos Noivos - Baú da Fé</title>
  
  <style>
    /* RESET GLOBAL */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background: #000 !important;
      position: relative;
    }

    /* CÂMERA DE FUNDO */
    #webcam {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform: scaleX(-1);
      display: none;
    }

    #webcam.active {
      display: block !important;
    }

    #camera-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.4);
      z-index: 2;
    }

    #camera-overlay.hidden {
      display: none !important;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* OCULTAÇÃO ESTREITA DE TELAS */
    .screen {
      display: none !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
      overflow: hidden;
      background: #000;
    }

    .screen.active {
      display: flex !important;
    }

    /* SLIDESHOW */
    #screen-slideshow { background: #000; cursor: pointer; }
    #slideshow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .slide-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .slide-img.active { opacity: 1; }
    .slideshow-touch-prompt {
      position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88); border: 2px solid #d4af37; padding: 16px 36px;
      border-radius: 40px; color: #ffffff; font-size: 1.3rem; font-weight: bold; z-index: 20;
    }

    /* INTRO / CAPA */
    #screen-intro { justify-content: center; align-items: center; background: #0f172a; }
    .intro-banner-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .bg-banner-img { width: 100%; height: 100%; object-fit: cover; }
    .btn-start-overlay {
      position: absolute; bottom: 11%; left: 31%; transform: translateX(-50%);
      width: 380px; height: 68px; background: linear-gradient(135deg, #d4af37, #aa7c11);
      color: #ffffff; font-size: 1.2rem; font-weight: bold; border: 2px solid #fff5cc;
      border-radius: 35px; cursor: pointer;
    }

    /* CONTAGEM */
    #screen-countdown { background: transparent !important; justify-content: center; align-items: center; }
    .countdown-overlay { background: rgba(15, 23, 42, 0.85); padding: 40px 60px; border-radius: 24px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.2); }
    .countdown-overlay h2 { color: #ffffff; font-size: 2rem; margin-bottom: 10px; }
    #countdown-number { font-size: 5.5rem; font-weight: 900; color: #2ecc71; display: block; }

    /* QUIZ / GAME */
    #screen-game { background: transparent !important; padding: 24px 32px; }
    .gradient-overlay { position: absolute; top: 0; left: 0; width: 55%; height: 100%; background: linear-gradient(to right, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.65) 75%, transparent 100%); z-index: 2; pointer-events: none; }
    .quiz-sidebar { position: relative; z-index: 3; width: 48%; min-width: 400px; display: flex; flex-direction: column; gap: 16px; height: 100%; }
    .app-logo { max-height: 60px; max-width: 85%; object-fit: contain; }
    .question-container { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(212, 175, 55, 0.4); border-left: 6px solid #d4af37; border-radius: 16px; padding: 20px 24px; min-height: 100px; display: flex; align-items: center; }
    #question-text { font-size: 1.45rem; color: #ffffff; font-weight: 600; }
    .options-stack { display: flex; flex-direction: column; gap: 12px; }
    .btn-option { background: rgba(30, 41, 59, 0.9); color: #ffffff; border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 16px 20px; font-size: 1.25rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 16px; text-align: left; }
    .opt-badge { background: #d4af37; color: #0f172a; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
    .opt-text { flex: 1; }
    .btn-option.correta { background-color: #2ecc71 !important; border-color: #27ae60 !important; }
    .btn-option.incorreta { background-color: #e74c3c !important; border-color: #c0392b !important; }
    .bottom-status-zone { margin-top: auto; min-height: 90px; display: flex; align-items: center; }
    #timer { font-size: 2.3rem; font-weight: 900; background: rgba(15, 23, 42, 0.95); width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #2ecc71; color: #2ecc71; }
    .feedback-banner { width: 100%; background: rgba(15, 23, 42, 0.95); border-radius: 16px; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; border: 1.5px solid rgba(255, 255, 255, 0.2); }
    .feedback-banner.hidden { display: none !important; }

    /* AGRADECIMENTO */
    #screen-thanks { background: #0f172a !important; justify-content: center; align-items: center; padding: 24px; }
    .thanks-card { background: rgba(30, 41, 59, 0.95); border-radius: 24px; padding: 24px 36px; text-align: center; border: 1px solid rgba(212, 175, 55, 0.5); display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 820px; }
    .thanks-card h2 { color: #ffffff; font-size: 1.8rem; }
    .thanks-card p { color: #cbd5e1; font-size: 1rem; }
    .captured-photo-frame { width: 600px; height: 337px; border-radius: 16px; overflow: hidden; border: 3px solid #d4af37; }
    #captured-photo { width: 100%; height: 100%; object-fit: contain; background: #0f172a; }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="camera-overlay" class="hidden"></div>

  <div id="app">
    <div id="screen-slideshow" class="screen active">
      <div id="slideshow-container"></div>
      <div class="slideshow-touch-prompt"><span>Toque na tela para brincar! 🎁</span></div>
    </div>
    
    <div id="screen-intro" class="screen">
      <div class="intro-banner-container">
        <img src="fundo-intro.jpg" alt="Baú da Fé" class="bg-banner-img">
        <button id="btn-start" class="btn-start-overlay">Já abençoei os noivos e quero brincar!</button>
      </div>
    </div>

    <div id="screen-countdown" class="screen">
      <div class="countdown-overlay">
        <h2>Prepare-se... 📸</h2>
        <span id="countdown-number">3</span>
      </div>
    </div>

    <div id="screen-game" class="screen">
      <div class="gradient-overlay"></div>
      <div class="quiz-sidebar">
        <div class="logo-box-game"><img src="logo.png" alt="Baú da Fé" class="app-logo"></div>
        <div class="question-container"><h2 id="question-text">Carregando pergunta...</h2></div>
        <div class="options-stack">
          <button id="btn-0" class="btn-option"><span class="opt-badge">A</span> <span class="opt-text">Opção 1</span></button>
          <button id="btn-1" class="btn-option"><span class="opt-badge">B</span> <span class="opt-text">Opção 2</span></button>
          <button id="btn-2" class="btn-option"><span class="opt-badge">C</span> <span class="opt-text">Opção 3</span></button>
          <button id="btn-3" class="btn-option"><span class="opt-badge">D</span> <span class="opt-text">Opção 4</span></button>
        </div>
        <div class="bottom-status-zone">
          <div id="timer-badge" class="timer-badge"><span id="timer">20</span></div>
          <div id="feedback-banner" class="feedback-banner hidden">
            <div class="feedback-header"><span id="feedback-emoji">🎉</span><span id="feedback-title">RESPOSTA CORRETA!</span></div>
            <p id="feedback-text"></p>
          </div>
        </div>
      </div>
    </div>

    <div id="screen-thanks" class="screen">
      <div class="thanks-card">
        <h2>Muito Obrigado por Participar! ❤️</h2>
        <p>Sua reação e participação foram registradas com sucesso:</p>
        <div class="captured-photo-frame"><img id="captured-photo" src="" alt="Sua Reação no Quiz"></div>
        <p style="color: #2ecc71; font-weight: bold;">Os noivos amaram sua presença!</p>
      </div>
    </div>
  </div>

  <script src="script.js?v=10"></script>
</body>
</html>
