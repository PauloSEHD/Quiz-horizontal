<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz dos Noivos - Baú da Fé</title>
  <!-- O ?v=2 ao final do arquivo impede que o navegador use a versão em cache -->
  <link rel="stylesheet" href="styles.css?v=99">
</head>
<body>

  <!-- Câmera / Fundo Vivo -->
  <video id="webcam" autoplay playsinline muted></video>
  <div id="camera-overlay" class="hidden"></div>

  <div id="app">

    <!-- TELA 0: SLIDE SHOW DE FOTOS DO CASAL (MODO DESCANSO) -->
    <div id="screen-slideshow" class="screen active">
      <div id="slideshow-container">
        <!-- As imagens são inseridas pelo JS -->
      </div>
      <div class="slideshow-touch-prompt">
        <span>Toque na tela para brincar! 🎁</span>
      </div>
    </div>
    
    <!-- TELA 1: CAPA COM PIX E INÍCIO DO JOGO -->
    <div id="screen-intro" class="screen">
      <div class="intro-banner-container">
        <img src="fundo-intro.jpg" alt="Baú da Fé - Quiz dos Noivos" class="bg-banner-img">
        <button id="btn-start" class="btn-start-overlay">
          Já abençoei os noivos e quero brincar!
        </button>
      </div>
    </div>

    <!-- TELA 2: CONTAGEM REGRESSIVA (3s) -->
    <div id="screen-countdown" class="screen">
      <div class="countdown-overlay">
        <h2>Prepare-se... 📸</h2>
        <span id="countdown-number">3</span>
      </div>
    </div>

    <!-- TELA 3: JOGO DO QUIZ -->
    <div id="screen-game" class="screen">
      <div class="gradient-overlay"></div>

      <div class="quiz-sidebar">
        <!-- Logo no Topo do Jogo -->
        <div class="logo-box-game">
          <img src="imagens/logo.jpg" alt="Baú da Fé" class="app-logo">
        </div>

        <div class="question-container">
          <h2 id="question-text">Carregando pergunta...</h2>
        </div>

        <div class="options-stack">
          <button id="btn-0" class="btn-option"><span class="opt-badge">A</span> <span class="opt-text">Opção 1</span></button>
          <button id="btn-1" class="btn-option"><span class="opt-badge">B</span> <span class="opt-text">Opção 2</span></button>
          <button id="btn-2" class="btn-option"><span class="opt-badge">C</span> <span class="opt-text">Opção 3</span></button>
          <button id="btn-3" class="btn-option"><span class="opt-badge">D</span> <span class="opt-text">Opção 4</span></button>
        </div>

        <div class="bottom-status-zone">
          <!-- Cronômetro Maior -->
          <div id="timer-badge" class="timer-badge">
            <span id="timer" class="timer-verde">20</span>
          </div>

          <!-- Banner de Feedback / Explicação -->
          <div id="feedback-banner" class="feedback-banner hidden">
            <div class="feedback-header">
              <span id="feedback-emoji">🎉</span>
              <span id="feedback-title">RESPOSTA CORRETA!</span>
            </div>
            <p id="feedback-text"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- TELA 4: AGRADECIMENTO & MOLDURA FINAL DA REAÇÃO -->
    <div id="screen-thanks" class="screen">
      <div class="thanks-card">
        <h2>Muito Obrigado por Participar! ❤️</h2>
        <p>Sua reação e participação foram registradas com sucesso:</p>
        
        <div class="captured-photo-frame">
          <img id="captured-photo" src="" alt="Sua Reação no Quiz">
        </div>

        <p class="thanks-footer">Os noivos amaram sua presença!</p>
      </div>
    </div>

  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
