<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz dos Noivos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Câmera de Fundo -->
  <video id="webcam" autoplay playsinline muted></video>
  <div id="camera-overlay"></div>

  <div id="app">
    <!-- TELA 1: INTRODUÇÃO -->
    <div id="screen-intro" class="screen active">
      <div class="intro-photo-container">
        <img id="img-top" class="photo-landscape" src="" alt="Foto 1">
      </div>

      <div class="intro-content">
        <h1>Quiz dos Noivos</h1>
        <button id="btn-start" class="btn-start-game">INICIAR QUIZ 🚀</button>
      </div>

      <div class="intro-photo-container">
        <img id="img-bottom" class="photo-landscape" src="" alt="Foto 2">
      </div>
    </div>

    <!-- TELA 2: JOGO -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <div id="timer" class="timer-verde">20</div>
      </div>

      <div class="question-container">
        <h2 id="question-text">Carregando pergunta...</h2>
      </div>

      <div class="options-grid">
        <button id="btn-0" class="btn-option">1. Opção 1</button>
        <button id="btn-1" class="btn-option">2. Opção 2</button>
        <button id="btn-2" class="btn-option">3. Opção 3</button>
        <button id="btn-3" class="btn-option">4. Opção 4</button>
      </div>
    </div>

    <!-- TELA 3: RESULTADO -->
    <div id="screen-result" class="screen">
      <div class="result-card">
        <h2 id="result-message">RESPOSTA CORRETA! 🎉</h2>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
