<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz dos Noivos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Background Câmera -->
  <video id="webcam" autoplay playsinline muted></video>
  <div id="camera-overlay"></div>

  <div id="app">
    <!-- TELA 1: INTRODUÇÃO / DESCANSO -->
    <div id="screen-intro" class="screen active">
      <div class="intro-photo-container">
        <img id="img-top" class="photo-landscape" src="" alt="Foto 1">
      </div>

      <div class="intro-content">
        <!-- Espaço para Logo -->
        <div class="logo-placeholder">
          <span class="logo-text">💍 LOGO DOS NOIVOS 💍</span>
        </div>

        <h1 class="game-title">Quiz dos Noivos</h1>

        <button id="btn-start" class="btn-start-game">Já fiz minha contribuição e quero jogar! 🎁</button>

        <p class="lgpd-notice">
          Ao clicar para jogar, você concorda em gravar sua participação para a lembrança digital dos noivos. 🎥✨
        </p>
      </div>

      <div class="intro-photo-container">
        <img id="img-bottom" class="photo-landscape" src="" alt="Foto 2">
      </div>
    </div>

    <!-- TELA 2: JOGO (HUD LATERAL) -->
    <div id="screen-game" class="screen">
      <div class="quiz-sidebar">
        
        <div class="timer-badge">
          <span id="timer" class="timer-verde">20</span>
        </div>

        <div class="question-container">
          <h2 id="question-text">Carregando pergunta...</h2>
        </div>

        <div class="options-stack">
          <button id="btn-0" class="btn-option"><span class="opt-num">1</span> <span class="opt-text">Opção 1</span></button>
          <button id="btn-1" class="btn-option"><span class="opt-num">2</span> <span class="opt-text">Opção 2</span></button>
          <button id="btn-2" class="btn-option"><span class="opt-num">3</span> <span class="opt-text">Opção 3</span></button>
          <button id="btn-3" class="btn-option"><span class="opt-num">4</span> <span class="opt-text">Opção 4</span></button>
        </div>

        <!-- Feedback exibido no canto inferior esquerdo -->
        <div id="feedback-banner" class="feedback-banner hidden">
          <span id="feedback-emoji">🎉</span>
          <span id="feedback-text">RESPOSTA CORRETA!</span>
        </div>

      </div>

      <!-- Zona livre da câmera -->
      <div class="camera-viewport-zone"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
