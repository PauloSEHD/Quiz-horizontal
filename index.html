<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz dos Noivos - Baú da Fé</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Câmera Escondida em Segundo Plano -->
  <video id="webcam" autoplay playsinline muted></video>
  <div id="camera-overlay" class="hidden"></div>
  <canvas id="photo-canvas" style="display: none;"></canvas>

  <div id="app">

    <!-- TELA 0: SLIDE SHOW DE FOTOS DO CASAL (MODO DESCANSO / OCIOSO) -->
    <div id="screen-slideshow" class="screen active">
      <div id="slideshow-container">
        <!-- As imagens serão inseridas dinamicamente pelo JavaScript -->
      </div>
      <div class="slideshow-touch-prompt">
        <span>Toque na tela para brincar! 🎁</span>
      </div>
    </div>
    
    <!-- TELA 1: CAPA COM PIX E INÍCIO DO JOGO -->
    <div id="screen-intro" class="screen">
      <div class="intro-banner-container">
        <img src="fundo-intro.jpg" alt="Baú da Fé - Quiz dos Noivos" class="bg-banner-img">
        <button id="btn-start" class="btn-start-overlay">
          Já abençoei os noivos e quero brincar! 🎁
        </button>
      </div>
    </div>

    <!-- TELA 2: CONTAGEM REGRESSIVA (3s) -->
    <div id="screen-countdown" class="screen">
      <div class="countdown-overlay">
        <h2>Prepare-se... 📸</h2>
        <span id="countdown-number">3</span>
      </div>
    </div>

    <!-- TELA 3: JOGO -->
    <div id="screen-game" class="screen">
      <div class="quiz-sidebar">
        <div class="logo-box-game">
          <span class="logo-text">Quiz</span>
        </div>

        <div class="question-container">
          <h2 id="question-text">Carregando pergunta...</h2>
        </div>

        <div class="options-stack">
          <button id="btn-0" class="btn-option"><span class="opt-num">1</span> <span class="opt-text">Opção 1</span></button>
          <button id="btn-1" class="btn-option"><span class="opt-num">2</span> <span class="opt-text">Opção 2</span></button>
          <button id="btn-2" class="btn-option"><span class="opt-num">3</span> <span class="opt-text">Opção 3</span></button>
          <button id="btn-3" class="btn-option"><span class="opt-num">4</span> <span class="opt-text">Opção 4</span></button>
        </div>

        <div class="bottom-status-zone">
          <div id="timer-badge" class="timer-badge">
            <span id="timer" class="timer-verde">20</span>
          </div>

          <div id="feedback-banner" class="feedback-banner hidden">
            <span id="feedback-emoji">🎉</span>
            <span id="feedback-text">RESPOSTA CORRETA!</span>
          </div>
        </div>
      </div>

      <div class="camera-viewport-zone"></div>
    </div>

    <!-- TELA 4: AGRADECIMENTO & FOTO -->
    <div id="screen-thanks" class="screen">
      <div class="thanks-card">
        <h2>Muito Obrigado por Participar! ❤️</h2>
        <p>Sua reação e participação foram registradas com sucesso:</p>
        
        <div class="captured-photo-frame">
          <img id="captured-photo" src="" alt="Sua Reação no Quiz">
        </div>

        <p class="thanks-footer">Os noivos amaram sua presença!</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
