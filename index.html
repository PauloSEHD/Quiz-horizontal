<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz - Baú da Fé</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Container principal (Espelho da Câmera + Overlay) -->
  <div id="quiz-container">
    
    <!-- Feed da Câmera em Tela Cheia -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Overlay Gradiente Escuro (Garante leitura perfeita das letras) -->
    <div class="gradient-overlay"></div>

    <!-- Painel Lateral de Perguntas e Respostas -->
    <div class="sidebar-panel">
      
      <!-- Topo com Logo -->
      <div class="logo-container">
        <img src="logo.png" alt="Baú da Fé" class="app-logo" />
      </div>

      <!-- Caixa da Pergunta -->
      <div class="question-card">
        <h2 id="question-text">Carregando pergunta...</h2>
      </div>

      <!-- Lista de Alternativas (A, B, C, D) -->
      <div class="options-container" id="options-container">
        <!-- Gerado via JavaScript -->
      </div>

      <!-- Rodapé do Painel: Cronômetro / Card de Explicação -->
      <div class="bottom-panel">
        
        <!-- Cronômetro Destacado -->
        <div id="timer-box" class="timer-box">
          <span id="timer-count">10</span>
        </div>

        <!-- Card de Explicação (Escondido inicialmente) -->
        <div id="explanation-card" class="explanation-card hidden">
          <div class="explanation-header">
            <span class="icon">📢</span> EXPLICAÇÃO
          </div>
          <p id="explanation-text"></p>
        </div>

      </div>

    </div>

  </div>

  <!-- Modal de Finalização (Resultado e Miniatura) -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Muito Obrigado por Participar! ❤️</h2>
      <p>Sua reação e participação foram registradas com sucesso:</p>
      
      <!-- Preview do Card da Imagem Final -->
      <div class="preview-frame">
        <canvas id="final-canvas"></canvas>
      </div>

      <p class="wedding-footer-text">Os noivos amaram sua presença!</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
